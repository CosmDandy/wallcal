# Пины по SHA не обновляются сами — этим занимается Dependabot: он поднимает PR
# с новым SHA и правит комментарий-версию рядом.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Пауза перед обновлением: большинство supply-chain атак на пакеты и экшены
    # выявляют в первые дни, поэтому свежие релизы не тянем сразу.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Дайджесты базового образа и uv в Dockerfile — такие же пины, и без этого
  # блока они стоят на месте, а с ними и пакеты Debian внутри образа.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ["*"]

  # uv.lock: security-апдейты приходят и без этого блока, а обычные версии —
  # нет, и лок отстаёт, пока очередная CVE не потащит за собой мажорный скачок.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
