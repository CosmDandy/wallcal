# Builds the container image and pushes it to GHCR. Actions are pinned by full
# commit SHA rather than by tag, for the same reason as in security.yml: a tag
# can be moved by the action's owner onto different code. Dependabot updates the
# pins; the version in the comment is only for reading.
name: image

on:
  push:
    branches: [main, master]
    # Tag pushes publish a versioned image; branch pushes only refresh :edge.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

# :edge and :latest are moving tags. Two runs finishing out of order would leave
# one pointing at the older digest, so runs on a ref queue instead of racing —
# and they are not cancelled, because a cancelled push leaves the tag behind.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Provenance is signed through OIDC; both are needed for the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # amd64 only: the deployment target is an x86 server. Adding arm64 means
      # building it under QEMU, which roughly triples the job for an artefact
      # nothing here would pull. Add the platform back when there is a machine
      # that needs it.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # A pull request from a fork has no write token, so it builds without
      # pushing: the point of running it there is to catch a broken Dockerfile.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # :edge follows the default branch, :1.2.3 / :1.2 / :1 come from tags,
          # and :latest is only ever a released tag — never a branch build.
          tags: |
            type=edge,branch=${{ github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=wallcal
            org.opencontainers.image.description=Self-hosted calendar wallpapers rendered from a URL

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The dependency layer is the expensive one; the cache keeps a code-only
          # change from re-resolving it every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Signed statement of what built this digest, verifiable with
      # `gh attestation verify oci://ghcr.io/<repo>:<tag> --owner <owner>`.
      - if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The image is useless if it renders nothing, and a Dockerfile can break that
  # without breaking the build. One amd64 image, started and asked for a PNG.
  smoke:
    name: smoke test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: wallcal:smoke
          cache-from: type=gha

      - name: it serves a wallpaper
        run: |
          set -euo pipefail
          docker run -d --name wallcal -p 8000:8000 -e WALLCAL_TZ=Europe/Moscow wallcal:smoke
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break || sleep 1
          done

          # A tz other than the container's default proves tzdata shipped.
          curl -fsS -o shot.png \
            'http://127.0.0.1:8000/w/span.png?f=2026-01-01&t=2026-12-31&tz=Asia/Tokyo'
          file shot.png | grep -q 'PNG image data' || { echo "::error::not a PNG"; exit 1; }
          [ "$(stat -c%s shot.png)" -gt 5000 ] || { echo "::error::PNG suspiciously small"; exit 1; }

          # The builder page must ship too: it is half the product. Saved first
          # rather than piped: `grep -q` closes the pipe on its first match, and
          # with pipefail on, curl then fails with EPIPE and the step reports a
          # missing page. The page passed 64 KB — the pipe buffer — and started
          # losing that race.
          curl -fsS -o page.html http://127.0.0.1:8000/
          grep -q 'data-key=' page.html \
            || { echo "::error::builder page missing from the image"; exit 1; }

          # And it must not be running as root.
          [ "$(docker exec wallcal id -u)" != "0" ] || { echo "::error::running as root"; exit 1; }

      - if: always()
        run: docker logs wallcal || true
