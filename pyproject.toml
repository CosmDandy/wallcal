[project]
name = "wallcal"
version = "1.0.1"
description = "Self-hosted calendar wallpapers rendered on demand from a URL"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "pillow>=11.0",
    "uvicorn>=0.32",
]

[project.scripts]
wallcal = "wallcal.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.3.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallcal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
