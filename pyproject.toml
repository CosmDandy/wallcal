[project]
name = "wallcal"
version = "2.0.1"
description = "Self-hosted calendar wallpapers rendered on demand from a URL"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "pillow>=11.0",
    "uvicorn>=0.32",
]

[project.scripts]
wallcal = "wallcal.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.3.1",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallcal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test renders real PNGs, which is CPU work and nothing else: the suite
# took half a minute pinned to one core while seven sat idle. Split across them
# it is seven seconds. `-n auto` reads the machine rather than a fixed number,
# so a two-core runner is not asked to run eight workers.
addopts = "-q -n auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
